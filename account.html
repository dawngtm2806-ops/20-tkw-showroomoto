<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title_account">Morent — Tài khoản của tôi</title>
  <meta name="description" content="Trang tài khoản Morent: hồ sơ cá nhân, lịch nhận xe đã đặt và danh sách xe yêu thích." />
  <meta name="robots" content="noindex" />
  <meta property="og:title" content="Morent — Tài khoản của tôi" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233563E9'/%3E%3Cpath d='M4 14l1.5-4A2 2 0 017.4 9h9.2a2 2 0 011.9 1L20 14v3a1 1 0 01-1 1h-1v-1H6v1H5a1 1 0 01-1-1z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" /><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
  <link rel="stylesheet" href="dist/output.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <nav class="container-x pt-6" aria-label="Breadcrumb">
      <ol class="flex items-center gap-2 text-sm text-muted">
        <li><a href="index.html" class="hover:text-primary" data-i18n="crumb_home">Trang chủ</a></li>
        <li aria-hidden="true">/</li>
        <li class="text-ink font-semibold" data-i18n="nav_account">Tài khoản của tôi</li>
      </ol>
    </nav>

    <section class="container-x py-8">
      <div class="grid gap-8 lg:grid-cols-[300px_1fr] items-start">
        <!-- Cột hồ sơ -->
        <aside class="card p-6 text-center lg:sticky" style="top:88px">
          <div class="w-20 h-20 rounded-full bg-primary text-white flex items-center justify-center mx-auto mb-4 font-extrabold" style="font-size:32px" id="ac-avatar">A</div>
          <h1 class="font-extrabold text-lg" id="ac-name" data-i18n="ac_guest">Khách</h1>
          <p class="text-muted text-sm break-all" id="ac-email">—</p>
          <div class="divider my-5"></div>
          <div class="grid grid-cols-2 gap-3 text-center">
            <div class="card p-3" style="background:var(--bg)"><div class="text-2xl font-extrabold text-primary" id="ac-stat-bookings">0</div><div class="text-muted text-xs mt-1" data-i18n="ac_stat_bookings">Lịch nhận xe</div></div>
            <div class="card p-3" style="background:var(--bg)"><div class="text-2xl font-extrabold text-primary" id="ac-stat-favs">0</div><div class="text-muted text-xs mt-1" data-i18n="ac_stat_favs">Xe yêu thích</div></div>
          </div>
          <button class="btn btn-ghost btn-block mt-5" id="ac-logout" data-i18n="ac_logout">Đăng xuất</button>
          <a class="inline-flex items-center justify-center gap-1 text-xs text-muted mt-4 hover:text-primary" href="admin.html" data-i18n="ac_admin">Trang quản trị</a>
        </aside>

        <!-- Cột nội dung -->
        <div>
          <div class="flex gap-6 border-b mb-6" style="border-color:var(--line)">
            <button class="tab-btn active" data-tab="profile" type="button" data-i18n="ac_tab_profile">Hồ sơ</button>
            <button class="tab-btn" data-tab="bookings" type="button" data-i18n="ac_stat_bookings">Lịch nhận xe</button>
            <button class="tab-btn" data-tab="favs" type="button" data-i18n="ac_stat_favs">Xe yêu thích</button>
          </div>

          <!-- Tab: Hồ sơ -->
          <div data-panel="profile">
            <div class="card p-6 sm:p-8">
              <h2 class="font-bold text-lg mb-1" data-i18n="ac_info_t">Thông tin cá nhân</h2>
              <p class="text-muted text-sm mb-6" data-i18n="ac_info_p">Cập nhật thông tin liên hệ của bạn (lưu trên trình duyệt / tài khoản demo).</p>
              <form id="profile-form" class="grid gap-4 sm:grid-cols-2" novalidate>
                <div class="field" data-field="p-name"><label for="p-name" data-i18n="fld_name">Họ và tên</label><input class="input" id="p-name" type="text" /><span class="field__error"></span></div>
                <div class="field" data-field="p-email"><label for="p-email" data-i18n="lbl_email">Email</label><input class="input" id="p-email" type="email" disabled /><span class="field__error"></span></div>
                <div class="field" data-field="p-phone"><label for="p-phone" data-i18n="fld_phone">Số điện thoại</label><input class="input" id="p-phone" type="tel" placeholder="0901234567" /><span class="field__error"></span></div>
                <div class="field" data-field="p-city"><label for="p-city" data-i18n="ac_city">Tỉnh / Thành phố</label><input class="input" id="p-city" type="text" placeholder="TP. Hồ Chí Minh" /><span class="field__error"></span></div>
                <div class="sm:col-span-2"><button class="btn btn-primary" type="submit" data-i18n="ac_save">Lưu thay đổi</button></div>
              </form>
            </div>
          </div>

          <!-- Tab: Lịch nhận xe -->
          <div data-panel="bookings" hidden>
            <div id="ac-bookings" class="grid gap-4"></div>
          </div>

          <!-- Tab: Xe yêu thích -->
          <div data-panel="favs" hidden>
            <div id="ac-favs" class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/account.js"></script>
</body>
</html>
