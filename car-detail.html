<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title_detail">Chi tiết xe cho thuê | Morent</title>
  <meta name="description" content="Thông tin chi tiết mẫu xe cho thuê: thông số kỹ thuật, hình ảnh, đánh giá và giá thuê theo ngày tại Morent." />
  <meta property="og:title" content="Chi tiết xe | Morent" />
  <meta property="og:description" content="Thông số kỹ thuật, hình ảnh và đăng ký lái thử tại Morent." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233563E9'/%3E%3Cpath d='M4 14l1.5-4A2 2 0 017.4 9h9.2a2 2 0 011.9 1L20 14v3a1 1 0 01-1 1h-1v-1H6v1H5a1 1 0 01-1-1z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" /><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
  <link rel="stylesheet" href="dist/output.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container-x py-8" id="detail-root">
    <nav aria-label="breadcrumb" class="text-sm text-muted mb-6"><a href="index.html" data-i18n="crumb_home">Trang chủ</a> / <a href="cars.html" data-i18n="crumb_cars">Danh mục xe</a> / <span id="crumb" class="text-ink font-semibold">Chi tiết</span></nav>

    <div class="grid gap-10 lg:grid-cols-2">
      <!-- Gallery / slider ảnh -->
      <section>
        <div class="card p-6 relative">
          <div class="absolute top-4 left-4 flex gap-2" id="detail-badges"></div>
          <button class="icon-btn" id="detail-fav" aria-label="Favorite" style="position:absolute;top:16px;right:16px;z-index:2"></button>
          <div id="detail-main" class="flex items-center justify-center" style="min-height:260px"></div>
          <button class="swap-btn" id="slide-prev" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:44px;height:44px" aria-label="Previous image">‹</button>
          <button class="swap-btn" id="slide-next" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);width:44px;height:44px" aria-label="Next image">›</button>
        </div>
        <div class="flex gap-3 mt-4 justify-center flex-wrap" id="detail-thumbs"></div>
      </section>

      <!-- Thông tin -->
      <section id="detail-info" class="card p-6 lg:p-8"></section>
    </div>

    <!-- Tabs: thông số dạng tab -->
    <section class="mt-14">
      <div class="flex gap-6 border-b" style="border-color:var(--line)" id="detail-tabs" role="tablist">
        <button class="tab-btn active" data-tab="overview" role="tab" data-i18n="tab_overview">Tổng quan</button>
        <button class="tab-btn" data-tab="specs" role="tab" data-i18n="tab_specs">Thông số kỹ thuật</button>
      </div>
      <div class="pt-6">
        <div data-panel="overview"></div>
        <div data-panel="specs" hidden></div>
      </div>
    </section>

    <!-- Đánh giá & bình luận (ngay dưới Tổng quan) -->
    <section class="mt-16" id="reviews-section"></section>

    <!-- Tính chi phí thuê -->
    <section class="mt-16" id="finance-calc"></section>

    <!-- Xe tương tự -->
    <section class="mt-16">
      <h2 class="section-title mb-6" data-i18n="lbl_similar">Xe tương tự</h2>
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4" id="similar-cars"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/car-detail.js"></script>
</body>
</html>
