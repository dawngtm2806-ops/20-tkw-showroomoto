<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title_contact">Liên hệ | Morent cho thuê xe</title>
  <meta name="description" content="Liên hệ Morent — địa chỉ các chi nhánh, hotline, email và biểu mẫu gửi yêu cầu tư vấn thuê xe và dịch vụ." />
  <meta property="og:title" content="Liên hệ | Morent" />
  <meta property="og:description" content="Địa chỉ chi nhánh, hotline và biểu mẫu liên hệ Morent." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233563E9'/%3E%3Cpath d='M4 14l1.5-4A2 2 0 017.4 9h9.2a2 2 0 011.9 1L20 14v3a1 1 0 01-1 1h-1v-1H6v1H5a1 1 0 01-1-1z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" /><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
  <link rel="stylesheet" href="dist/output.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container-x py-8">
    <nav aria-label="breadcrumb" class="text-sm text-muted mb-2"><a href="index.html" data-i18n="crumb_home">Trang chủ</a> / <span class="text-ink font-semibold" data-i18n="nav_contact">Liên hệ</span></nav>
    <div class="mb-8">
      <h1 class="section-title" data-i18n="ct_title">Liên hệ với Morent</h1>
      <p class="section-sub mt-1" data-i18n="ct_sub">Cần tư vấn thuê xe hay dịch vụ? Gửi yêu cầu, chúng tôi sẽ phản hồi trong 24 giờ.</p>
    </div>

    <div class="grid gap-8 lg:grid-cols-[1fr_380px]">
      <!-- Form liên hệ -->
      <form class="card p-6 sm:p-8" id="ct-form" novalidate>
        <h2 class="font-bold text-xl mb-5" data-i18n="ct_form_t">Gửi yêu cầu tư vấn</h2>
        <div class="grid gap-5 sm:grid-cols-2">
          <div class="field" data-field="name">
            <label for="ct-name"><span data-i18n="fld_name">Họ và tên</span> <span class="req">*</span></label>
            <input class="input" id="ct-name" type="text" placeholder="Nguyễn Văn A" data-i18n-ph="ph_name" autocomplete="name" />
            <span class="field__error"></span>
          </div>
          <div class="field" data-field="phone">
            <label for="ct-phone"><span data-i18n="fld_phone">Số điện thoại</span> <span class="req">*</span></label>
            <input class="input" id="ct-phone" type="tel" placeholder="0901 234 567" autocomplete="tel" inputmode="tel" />
            <span class="field__error"></span>
          </div>
          <div class="field sm:col-span-2" data-field="email">
            <label for="ct-email"><span data-i18n="lbl_email">Email</span> <span class="req">*</span></label>
            <input class="input" id="ct-email" type="email" placeholder="ban@email.com" autocomplete="email" />
            <span class="field__error"></span>
          </div>
          <div class="field sm:col-span-2" data-field="subject">
            <label for="ct-subject" data-i18n="ct_subject">Chủ đề</label>
            <select class="select" id="ct-subject">
              <option value="rent" data-i18n="ct_opt1">Tư vấn thuê xe</option>
              <option value="price" data-i18n="ct_opt2">Giá &amp; khuyến mãi</option>
              <option value="service" data-i18n="ct_opt3">Dịch vụ &amp; hỗ trợ</option>
              <option value="other" data-i18n="ct_opt4">Khác</option>
            </select>
            <span class="field__error"></span>
          </div>
          <div class="field sm:col-span-2" data-field="message">
            <label for="ct-message"><span data-i18n="ct_message">Nội dung</span> <span class="req">*</span></label>
            <textarea class="textarea" id="ct-message" placeholder="Nhập nội dung cần tư vấn..." data-i18n-ph="ct_message_ph"></textarea>
            <span class="field__error"></span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-6" data-i18n="ct_submit">Gửi yêu cầu</button>
      </form>

      <!-- Thông tin liên hệ -->
      <aside class="grid gap-4 h-max" id="contact-info"></aside>
    </div>

    <!-- Bản đồ -->
    <section class="mt-10">
      <div class="card overflow-hidden">
        <iframe title="Morent branches map" width="100%" height="360" style="border:0;display:block" loading="lazy"
          src="https://www.openstreetmap.org/export/embed.html?bbox=106.695%2C10.770%2C106.712%2C10.784&amp;layer=mapnik&amp;marker=10.777%2C106.7035"></iframe>
      </div>
    </section>

    <!-- Chi nhánh -->
    <section class="mt-12">
      <h2 class="section-title mb-6" data-i18n="ct_branches_t">Hệ thống chi nhánh</h2>
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4" id="branches"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/contact.js"></script>
</body>
</html>
